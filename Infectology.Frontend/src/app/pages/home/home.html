
<div class="home-container">

  <header class="home-header">
    <div class="welcome">
      <h1>Vitaj</h1>
      <p>Prehľad tvojho účtu</p>
    </div>
  </header>

  <mat-card class="user-card" appearance="outlined">
    <mat-card-header>
      <div mat-card-avatar class="user-avatar">
        <mat-icon>person</mat-icon>
      </div>

      <mat-card-title>
        {{ firstName }} {{ lastName }}
      </mat-card-title>

      <mat-card-subtitle>
        Prihlásený používateľ
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="role-row">
        <mat-icon>verified_user</mat-icon>
        <span class="role-label">Tvoja rola:</span>

        <mat-chip-set>
          <mat-chip>{{ role }}</mat-chip>
        </mat-chip-set>
      </div>
    </mat-card-content>
  </mat-card>

</div>
